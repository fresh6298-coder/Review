<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>U+오더 고객 이관 정보 — 관리자</title>
<style>
:root{--blue:#0066cc;--ink:#1d1d1f;--muted:#6e6e73;--line:#d2d2d7;--bg:#f5f5f7;--white:#fff;--red:#b42318;--green:#0f7b34;--amber:#b54708}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;color:var(--ink);line-height:1.6}
.wrap{max-width:1120px;margin:0 auto;padding:36px 24px 80px}

/* 로그인 */
#loginView{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:100%;max-width:400px;background:#fff;border-radius:22px;padding:34px 30px;box-shadow:0 10px 40px rgba(20,20,40,.08)}
.login-card .eyebrow{color:var(--blue);font-weight:800;font-size:13px}
.login-card h1{font-size:22px;margin:8px 0 6px}
.login-card p.sub{color:var(--muted);font-size:13.5px;margin:0 0 22px}
.login-card label{display:block;font-weight:750;margin-bottom:7px;font-size:14px}
.login-card input{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:15px;margin-bottom:14px;background:#fff;color:var(--ink)}
.login-card input:focus{outline:2px solid #9ec5ff;border-color:var(--blue)}
.login-card button{width:100%;border:0;border-radius:12px;padding:14px;font-weight:800;font-size:15px;background:var(--blue);color:#fff;cursor:pointer}
.login-card button:disabled{background:#9db4cc;cursor:not-allowed}
#loginError{color:var(--red);font-size:13px;margin-top:12px;min-height:18px}

/* 헤더 */
#appView{display:none}
.topbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar-in{max-width:1120px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar .brand{font-weight:900;color:var(--blue);font-size:17px}
.topbar .who{margin-left:auto;font-size:12.5px;color:var(--muted)}
.topbar button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 15px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink)}
.topbar button:hover{background:var(--bg)}

h1.page{font-size:26px;margin:26px 0 6px}
p.page-sub{color:var(--muted);font-size:14px;margin:0 0 20px}

.pii{background:#fff7ed;border-left:5px solid #f79009;padding:14px 18px;border-radius:10px;font-size:13px;line-height:1.6;margin-bottom:22px}
.pii b{color:var(--amber)}

/* 통계 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.stat .n{font-size:26px;font-weight:800;color:var(--blue);line-height:1.2;font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;color:var(--muted);margin-top:3px}
.stat.g .n{color:var(--green)}
.stat.r .n{color:var(--red)}

/* 툴바 */
.toolbar{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search],.toolbar select{border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13.5px;background:#fff;color:var(--ink)}
.toolbar input[type=search]{flex:1;min-width:180px}
.toolbar .spacer{flex:1}
.toolbar button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-size:12.5px;font-weight:800;cursor:pointer;color:var(--ink)}
.toolbar button.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
.toolbar button:hover{opacity:.88}
#exportHint{font-size:12.5px;color:var(--muted);margin:-6px 0 16px;min-height:18px;line-height:1.5}
#exportHint.ok{color:var(--green);font-weight:700}
#exportHint.warn{color:var(--amber);font-weight:700}

/* 목록 */
.entry{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:12px}
.entry-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-bottom:13px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.entry-name{font-size:17px;font-weight:800}
.entry-store{font-size:13px;color:var(--muted);background:var(--bg);border-radius:6px;padding:2px 9px}
.badge{font-size:12px;font-weight:800;border-radius:999px;padding:3px 11px}
.badge.agree{background:#e7f6ec;color:var(--green)}
.badge.disagree{background:#fdeceb;color:var(--red)}
.badge.think{background:#fff4e5;color:var(--amber)}
.badge.etc{background:#eef1f5;color:var(--muted)}
.entry-time{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.entry-del{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 10px;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer}
.entry-del:hover{color:var(--red);border-color:var(--red)}

.rows{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.row{display:grid;grid-template-columns:118px minmax(0,1fr);gap:10px;align-items:baseline}
.row.full{grid-column:1/-1}
.row .k{font-size:11.5px;font-weight:750;color:var(--muted)}
.row .v{font-size:13.5px;word-break:break-word;white-space:pre-wrap}
.row .v.empty{color:#b0aeb4}
.row .v a{color:var(--blue);text-decoration:none}

.empty-state{background:#fff;border:1px solid var(--line);border-radius:18px;padding:60px 20px;text-align:center;color:var(--muted);font-size:14.5px}

@media(max-width:820px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .rows{grid-template-columns:1fr}
  .wrap{padding:20px 14px 60px}
}
</style>
</head>
<body>

<!-- ══ 로그인 ══ -->
<div id="loginView">
  <form class="login-card" id="loginForm">
    <div class="eyebrow">U+오더 고객 이관</div>
    <h1>관리자 로그인</h1>
    <p class="sub">제출된 고객 정보를 조회하려면 관리자 계정으로 로그인해 주세요.</p>
    <label for="email">이메일</label>
    <input type="email" id="email" autocomplete="username" required>
    <label for="password">비밀번호</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <button type="submit" id="loginBtn">로그인</button>
    <div id="loginError"></div>
  </form>
</div>

<!-- ══ 본문 ══ -->
<div id="appView">
  <div class="topbar">
    <div class="topbar-in">
      <span class="brand">U+오더 고객 이관 정보</span>
      <span class="who" id="whoami"></span>
      <button type="button" id="logoutBtn">로그아웃</button>
    </div>
  </div>

  <div class="wrap">
    <h1 class="page">제출 내역</h1>
    <p class="page-sub">영업담당자가 제출한 고객 이관 정보 취합 결과입니다.</p>

    <div class="pii">
      <b>개인정보 취급 주의</b><br>
      이 화면에는 고객 성명·연락처 등 개인정보가 포함되어 있습니다. 화면 캡처·외부 전송·개인 저장장치 보관을 삼가고,
      내려받은 파일은 업무 처리 후 삭제해 주세요.
    </div>

    <div class="stats">
      <div class="stat"><div class="n" id="statTotal">-</div><div class="l">전체 제출</div></div>
      <div class="stat g"><div class="n" id="statAgree">-</div><div class="l">이관 동의</div></div>
      <div class="stat"><div class="n" id="statPending">-</div><div class="l">고민중 · 기타</div></div>
      <div class="stat r"><div class="n" id="statDisagree">-</div><div class="l">미동의</div></div>
    </div>

    <div class="toolbar">
      <input type="search" id="searchBox" placeholder="고객명 · 상호명 · 상담자 검색">
      <select id="filterConsent">
        <option value="">이관동의 전체</option>
        <option value="동의">동의</option>
        <option value="미동의">미동의</option>
        <option value="고민중">고민중</option>
        <option value="기타">기타</option>
      </select>
      <select id="filterBenefit">
        <option value="">교체희망 전체</option>
        <option value="배터리교체">배터리교체</option>
        <option value="거치대교체">거치대교체</option>
        <option value="교체미희망">교체미희망</option>
      </select>
      <span class="spacer"></span>
      <button type="button" id="xlsxBtn" class="pri">엑셀 내려받기</button>
      <button type="button" id="mailBtn">메일로 보내기</button>
      <button type="button" id="csvBtn">CSV</button>
    </div>
    <div id="exportHint"></div>

    <div id="list"><div class="empty-state">불러오는 중...</div></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
(function(){
  var firebaseConfig = {
    apiKey: "AIzaSyCRkZIjcL__dgSbFE90NqHySIMy-6uCWhg",
    authDomain: "reveiw-4021d.firebaseapp.com",
    databaseURL: "https://reveiw-4021d-default-rtdb.firebaseio.com",
    projectId: "reveiw-4021d",
    storageBucket: "reveiw-4021d.firebasestorage.app",
    messagingSenderId: "112787471912",
    appId: "1:112787471912:web:f0a0de19ac8d7309cdff1d",
    measurementId: "G-5942BZTMKP"
  };
  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();
  var consentRef = firebase.database().ref('consents');

  var loginView = document.getElementById('loginView');
  var appView = document.getElementById('appView');
  var loginForm = document.getElementById('loginForm');
  var loginBtn = document.getElementById('loginBtn');
  var loginError = document.getElementById('loginError');
  var listEl = document.getElementById('list');
  var searchBox = document.getElementById('searchBox');
  var filterConsent = document.getElementById('filterConsent');
  var filterBenefit = document.getElementById('filterBenefit');
  var items = [];
  var bound = false;

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function fmtTime(ms){
    if(!ms) return '';
    try { return new Date(ms).toLocaleString('ko-KR'); } catch(e){ return ''; }
  }
  function errMsg(code){
    var m = {
      'auth/invalid-email': '이메일 형식이 올바르지 않습니다.',
      'auth/user-not-found': '등록되지 않은 계정입니다.',
      'auth/wrong-password': '비밀번호가 올바르지 않습니다.',
      'auth/invalid-credential': '이메일 또는 비밀번호가 올바르지 않습니다.',
      'auth/too-many-requests': '로그인 시도가 많아 일시적으로 차단되었습니다. 잠시 후 다시 시도해 주세요.',
      'auth/operation-not-allowed': 'Firebase 콘솔에서 이메일/비밀번호 로그인을 사용 설정해 주세요.',
      'auth/network-request-failed': '네트워크 연결을 확인해 주세요.'
    };
    return m[code] || ('로그인에 실패했습니다. (' + code + ')');
  }

  /* ── 로그인 ── */
  loginForm.addEventListener('submit', function(e){
    e.preventDefault();
    loginBtn.disabled = true;
    loginError.textContent = '';
    auth.signInWithEmailAndPassword(
      document.getElementById('email').value.trim(),
      document.getElementById('password').value
    ).catch(function(err){
      loginError.textContent = errMsg(err.code);
    }).finally(function(){
      loginBtn.disabled = false;
    });
  });

  document.getElementById('logoutBtn').addEventListener('click', function(){
    auth.signOut();
  });

  auth.onAuthStateChanged(function(user){
    if(user){
      loginView.style.display = 'none';
      appView.style.display = 'block';
      document.getElementById('whoami').textContent = user.email;
      document.getElementById('password').value = '';
      if(!bound){ bound = true; subscribe(); }
    } else {
      loginView.style.display = 'grid';
      appView.style.display = 'none';
    }
  });

  /* ── 데이터 ── */
  function subscribe(){
    consentRef.orderByChild('createdAt').on('value', function(snap){
      var arr = [];
      snap.forEach(function(child){
        var v = child.val() || {};
        v.key = child.key;
        arr.push(v);
      });
      arr.reverse();
      items = arr;
      renderStats();
      render();
    }, function(err){
      listEl.innerHTML = '<div class="empty-state">불러오지 못했습니다: ' + esc(err.message) +
        '<br><br>Firebase 규칙에서 consents 경로의 읽기 권한이 <code>auth != null</code>로 설정되어 있는지 확인해 주세요.</div>';
    });
  }

  function renderStats(){
    document.getElementById('statTotal').textContent = items.length;
    document.getElementById('statAgree').textContent = items.filter(function(i){ return i.consent === '동의'; }).length;
    document.getElementById('statPending').textContent = items.filter(function(i){ return i.consent === '고민중' || i.consent === '기타'; }).length;
    document.getElementById('statDisagree').textContent = items.filter(function(i){ return i.consent === '미동의'; }).length;
  }

  function filtered(){
    var q = searchBox.value.trim().toLowerCase();
    var fc = filterConsent.value;
    var fb = filterBenefit.value;
    return items.filter(function(i){
      if(fc && i.consent !== fc) return false;
      if(fb && i.benefit !== fb) return false;
      if(q){
        var hay = [i.customerName, i.storeName, i.agentName, i.agentTeam, i.contactName].join(' ').toLowerCase();
        if(hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function badgeClass(c){
    if(c === '동의') return 'agree';
    if(c === '미동의') return 'disagree';
    if(c === '고민중') return 'think';
    return 'etc';
  }

  function holders(i){
    var out = [];
    if(i.fixedQty && Number(i.fixedQty) > 0) out.push('고정형 ' + esc(i.fixedColor || '색상미지정') + ' ' + esc(i.fixedQty) + '개');
    if(i.standQty && Number(i.standQty) > 0) out.push('스탠드형 ' + esc(i.standColor || '색상미지정') + ' ' + esc(i.standQty) + '개');
    if(i.wallQty && Number(i.wallQty) > 0) out.push('벽걸이형 ' + esc(i.wallColor || '색상미지정') + ' ' + esc(i.wallQty) + '개');
    return out.join(' · ');
  }

  function cell(k, v, full){
    var empty = !v;
    return '<div class="row' + (full ? ' full' : '') + '">' +
      '<div class="k">' + k + '</div>' +
      '<div class="v' + (empty ? ' empty' : '') + '">' + (empty ? '—' : v) + '</div></div>';
  }

  function render(){
    var rows = filtered();
    if(!rows.length){
      listEl.innerHTML = '<div class="empty-state">' +
        (items.length ? '조건에 맞는 제출 건이 없습니다.' : '아직 제출된 내역이 없습니다.') + '</div>';
      return;
    }
    listEl.innerHTML = rows.map(function(i){
      var hv = holders(i);
      return '<div class="entry">' +
        '<div class="entry-top">' +
          '<span class="entry-name">' + esc(i.customerName || '(이름 없음)') + '</span>' +
          '<span class="entry-store">' + esc(i.storeName || '-') + '</span>' +
          '<span class="badge ' + badgeClass(i.consent) + '">' + esc(i.consent || '미기재') + '</span>' +
          '<span class="entry-time">' + esc(fmtTime(i.createdAt)) + '</span>' +
          '<button type="button" class="entry-del" data-key="' + esc(i.key) + '">삭제</button>' +
        '</div>' +
        '<div class="rows">' +
          cell('가입자 연락처', i.customerPhone ? '<a href="tel:' + esc(i.customerPhone) + '">' + esc(i.customerPhone) + '</a>' : '') +
          cell('상담일자', esc(i.consultDate)) +
          cell('실소통 고객', esc(i.contactName)) +
          cell('실소통 연락처', i.contactPhone ? '<a href="tel:' + esc(i.contactPhone) + '">' + esc(i.contactPhone) + '</a>' : '') +
          cell('팀 / 대리점', esc(i.agentTeam)) +
          cell('상담자', esc(i.agentName) + (i.agentPhone ? ' (' + esc(i.agentPhone) + ')' : '')) +
          cell('교체 희망', esc(i.benefit), true) +
          (hv ? cell('거치대 상세', hv, true) : '') +
          (i.consentDetail ? cell('동의 상세', esc(i.consentDetail), true) : '') +
          (i.followSchedule ? cell('연락가능일정', esc(i.followSchedule), true) : '') +
          (i.equipmentNote ? cell('기타 요청', esc(i.equipmentNote), true) : '') +
        '</div>' +
      '</div>';
    }).join('');
  }

  listEl.addEventListener('click', function(e){
    var btn = e.target.closest('.entry-del');
    if(!btn) return;
    var it = items.filter(function(i){ return i.key === btn.dataset.key; })[0];
    if(!it) return;
    if(!confirm('"' + (it.customerName || '') + ' / ' + (it.storeName || '') + '" 제출 건을 삭제할까요?\n삭제한 내용은 복구할 수 없습니다.')) return;
    consentRef.child(it.key).remove().catch(function(err){
      alert('삭제에 실패했습니다: ' + err.message);
    });
  });

  searchBox.addEventListener('input', render);
  filterConsent.addEventListener('change', render);
  filterBenefit.addEventListener('change', render);

  /* ── 내보내기 ── */
  var exportHint = document.getElementById('exportHint');
  var HEAD = ['제출일시','가입자이름','상호명','가입자연락처','상담일자','실소통고객','실소통연락처',
    '팀/대리점','상담자','상담자연락처','이관동의','동의상세','연락가능일정','교체희망',
    '고정형색상','고정형수량','스탠드형색상','스탠드형수량','벽걸이형색상','벽걸이형수량','기타요청'];
  var WIDTHS = [18,11,18,15,12,11,15,18,11,15,9,28,24,12,11,10,12,11,12,11,28];

  function toRow(i){
    return [
      fmtTime(i.createdAt), i.customerName, i.storeName, i.customerPhone, i.consultDate,
      i.contactName, i.contactPhone, i.agentTeam, i.agentName, i.agentPhone,
      i.consent, i.consentDetail, i.followSchedule, i.benefit,
      i.fixedColor, i.fixedQty, i.standColor, i.standQty, i.wallColor, i.wallQty, i.equipmentNote
    ].map(function(v){ return v == null ? '' : String(v); });
  }
  function stamp(){ return new Date().toISOString().slice(0,10); }
  function hint(msg, cls){
    exportHint.textContent = msg || '';
    exportHint.className = cls || '';
  }
  function saveBlob(blob, filename){
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function downloadCsv(rows){
    function q(s){ return '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"'; }
    var lines = [HEAD.map(q).join(',')];
    rows.forEach(function(i){ lines.push(toRow(i).map(q).join(',')); });
    var name = 'uorder-consent-' + stamp() + '.csv';
    saveBlob(new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' }), name);
    return name;
  }

  // 모든 값을 문자열 셀로 기록해 전화번호 앞자리 0이 유실되지 않게 함
  function downloadXlsx(rows){
    if(typeof XLSX === 'undefined'){
      var fallback = downloadCsv(rows);
      hint('엑셀 변환 모듈을 불러오지 못해 CSV(' + fallback + ')로 내려받았습니다. 사내망에서 cdnjs 접속이 차단된 경우 발생합니다.', 'warn');
      return fallback;
    }
    var ws = XLSX.utils.aoa_to_sheet([HEAD].concat(rows.map(toRow)));
    ws['!cols'] = WIDTHS.map(function(w){ return { wch: w }; });
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '이관취합');
    var name = 'uorder-consent-' + stamp() + '.xlsx';
    XLSX.writeFile(wb, name);
    return name;
  }

  document.getElementById('xlsxBtn').addEventListener('click', function(){
    var rows = filtered();
    if(!rows.length){ alert('내려받을 내역이 없습니다.'); return; }
    var name = downloadXlsx(rows);
    if(exportHint.className !== 'warn'){
      hint(rows.length + '건을 ' + name + ' 파일로 내려받았습니다. 고객 개인정보가 포함된 파일이니 보관에 유의해 주세요.', 'ok');
    }
  });

  document.getElementById('csvBtn').addEventListener('click', function(){
    var rows = filtered();
    if(!rows.length){ alert('내려받을 내역이 없습니다.'); return; }
    hint(rows.length + '건을 ' + downloadCsv(rows) + ' 파일로 내려받았습니다.', 'ok');
  });

  document.getElementById('mailBtn').addEventListener('click', function(){
    var rows = filtered();
    if(!rows.length){ alert('보낼 내역이 없습니다.'); return; }
    if(!confirm(
      '고객 개인정보가 담긴 파일을 메일로 발송합니다.\n\n' +
      '· 사내 메일 주소로만 발송해 주세요\n' +
      '· 외부 메일·개인 메일 발송은 삼가 주세요\n\n' +
      rows.length + '건을 내보낼까요?'
    )) return;

    var name = downloadXlsx(rows);
    var agree = rows.filter(function(i){ return i.consent === '동의'; }).length;
    var disagree = rows.filter(function(i){ return i.consent === '미동의'; }).length;
    var pending = rows.length - agree - disagree;

    // 본문에는 집계만 담고, 개인정보는 첨부 파일로만 전달
    var subject = 'U+오더 고객 이관 정보 취합 (' + stamp() + ', ' + rows.length + '건)';
    var body = [
      'U+오더 고객 이관 정보 취합 결과를 공유드립니다.',
      '',
      '· 기준 일시: ' + new Date().toLocaleString('ko-KR'),
      '· 전체 건수: ' + rows.length + '건',
      '· 이관 동의: ' + agree + '건',
      '· 고민중·기타: ' + pending + '건',
      '· 미동의: ' + disagree + '건',
      '',
      '상세 내역은 첨부 파일(' + name + ')을 확인해 주세요.',
      '',
      '※ 고객 개인정보가 포함된 파일입니다. 열람·보관에 유의해 주시고 업무 처리 후 삭제해 주세요.'
    ].join('\n');

    setTimeout(function(){
      window.location.href = 'mailto:?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
    }, 400);

    hint('메일 작성창이 열립니다. 방금 내려받은 ' + name + ' 파일을 첨부해 주세요. (메일 본문에는 집계만 들어가고 고객정보는 첨부 파일에만 담깁니다)', 'ok');
  });
})();
</script>
</body>
</html>
