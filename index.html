<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGNAL Pitch Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f7f5;
    --surface: #ffffff;
    --ink: #15191a;
    --sub: #5c655f;
    --line: #e1e5e0;
    --accent: #189c47;
    --accent-ink: #ffffff;
    --accent-soft: #e3f5ea;
    --shadow: 0 1px 2px rgba(20,30,20,.05), 0 8px 24px rgba(20,30,20,.07);
    --en: 'Manrope', 'Pretendard Variable', sans-serif;
    --kr: 'Noto Sans KR', 'Pretendard Variable', 'Malgun Gothic', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #121212;
      --surface: #181818;
      --ink: #ffffff;
      --sub: #bdbdbd;
      --line: #2c2f2c;
      --accent: #1ed760;
      --accent-ink: #0d0d0d;
      --accent-soft: rgba(30,215,96,.14);
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--kr);
  }
  .card {
    max-width: 380px;
    width: 100%;
    margin: 24px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 40px 32px;
    box-shadow: var(--shadow);
    text-align: center;
  }
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: var(--en);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 3px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .brand i {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    display: block;
  }
  h1 { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; margin: 0 0 8px; text-wrap: balance; }
  p { color: var(--sub); font-size: 14px; margin: 0 0 28px; line-height: 1.6; }
  a.btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 16px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 700;
    font-size: 14.5px;
    margin-bottom: 10px;
  }
  a.btn.primary { background: var(--accent); color: var(--accent-ink); }
  a.btn.secondary { background: var(--accent-soft); color: var(--accent); }
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><i></i>SIGNAL PITCH DAY</div>
    <h1>SIGNAL Pitch Day</h1>
    <p>자료를 보고, 페이지별로 피드백을 남겨주세요.</p>
    <a class="btn primary" href="signal-pitchday.html">📊 자료 보기</a>
    <a class="btn secondary" href="feedback.html">💬 피드백 남기기</a>
  </div>
</body>
</html>
