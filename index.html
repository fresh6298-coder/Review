<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGNAL Pitch Day</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --border: #e2e4e8;
    --text: #1f2328;
    --muted: #6b7280;
    --accent: #2563eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
  }
  .card {
    max-width: 420px;
    width: 100%;
    margin: 24px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 28px;
    text-align: center;
  }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  a.btn {
    display: block;
    padding: 14px 16px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 12px;
  }
  a.btn.primary { background: var(--accent); color: #fff; }
  a.btn.secondary { background: #eef2ff; color: #4338ca; }
</style>
</head>
<body>
  <div class="card">
    <h1>SIGNAL Pitch Day</h1>
    <p>자료를 보고, 페이지별로 피드백을 남겨주세요.</p>
    <a class="btn primary" href="signal-pitchday.html">📊 자료 보기</a>
    <a class="btn secondary" href="feedback.html">💬 피드백 남기기</a>
  </div>
</body>
</html>
